<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artyom Black</title>
<meta name="description" content="Games and apps by Artyom Black: Tintora Sort, Tunnel Ride and I Love Kanji.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Artyom Black">
<meta property="og:description" content="Games and apps by Artyom Black.">
<meta property="og:url" content="https://artyom-black.github.io/">
<meta property="og:image" content="https://artyom-black.github.io/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first black stage. Sticky mark header, a swipeable coverflow shelf of tall live gameplay cards, a thumb-zone Games/Apps tab bar, and a full-screen app page per title. */
:root{
  --ink:#000; --fg:#f5f5f7; --muted:#9b9ba4; --dim:#62626b; --line:rgba(255,255,255,.12); --glass:rgba(22,22,26,.72);
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutR:max(16px,env(safe-area-inset-right,0px));
  --ch:min(calc(76vw * 16 / 9), calc(100svh - 232px), 620px);
  --cw:calc(var(--ch) * 9 / 16);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--ink)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden;min-height:100svh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#000}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}
img,video{max-width:100%;display:block}

#sparks{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}7%{opacity:.5}15%{opacity:.04}23%{opacity:.3}100%{opacity:0}}

#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;pointer-events:none}
#intro .ib{position:relative;width:min(44vw,200px);opacity:0;transform:scale(.94)}
#intro .ib img{width:100%}
#intro .sheen{position:absolute;inset:0;-webkit-mask:url(img/logo-vertical.png) center/contain no-repeat;mask:url(img/logo-vertical.png) center/contain no-repeat;overflow:hidden}
#intro .sheen::after{content:"";position:absolute;top:-30%;bottom:-30%;width:50%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-16deg)}
#intro.run .ib{animation:logoIn .9s var(--out) forwards}
#intro.run .sheen::after{animation:sheen 1s .55s var(--ease) forwards}
#intro.run{animation:introOut .55s 1.9s forwards}
#intro.done{display:none}
@keyframes logoIn{to{opacity:1;transform:none}}
@keyframes sheen{to{left:130%}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px var(--gutR) 10px var(--gut);background:linear-gradient(#000 55%,rgba(0,0,0,0))}
header.top img{height:32px;width:auto}
header.top nav{display:none;gap:4px}
main{position:relative;z-index:1;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.head{padding:6px var(--gutR) 0 var(--gut);max-width:1180px;margin:0 auto}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.95;letter-spacing:-.035em;margin:0;overflow:hidden}
.head h1 span{display:inline-block}
.head h1.swap span{animation:rise .6s var(--out)}
@keyframes rise{from{transform:translateY(100%)}}
.head p{margin:8px 0 0;color:var(--muted);font-size:14px}

.shelf{position:relative;margin-top:18px}
.track{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:6px calc((100vw - var(--cw)) / 2) 18px;perspective:1200px}
.track::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:28px;overflow:hidden;scroll-snap-align:center;background:#0b0b0e;
  border:1px solid var(--line);transform-origin:50% 60%;will-change:transform;text-align:left;isolation:isolate;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.card video,.card .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 18%,transparent 55%,rgba(0,0,0,.88) 86%,#000 100%);z-index:1}
.card .chip{position:absolute;top:14px;left:14px;z-index:2;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)}
.card .chip.soon{background:#fff;color:#000;border-color:#fff}
.card .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px}
.card .ic{width:52px;height:52px;border-radius:22%;flex:none;object-fit:cover;box-shadow:0 8px 20px -8px rgba(0,0,0,.9)}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;letter-spacing:-.01em}
.card small{display:block;color:#bdbdc5;font-size:13px;margin-top:2px}
.card .go{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none;transition:transform .3s var(--out)}
.card .go svg{width:18px;height:18px}
.card:hover .go{transform:translateX(3px)}
.card.enter{animation:cardIn .7s var(--out) both;animation-delay:calc(var(--i)*90ms)}
@keyframes cardIn{from{opacity:0;translate:0 40px}}
.dots{display:flex;justify-content:center;gap:7px;margin-top:2px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.28);transition:width .4s var(--out),background .3s}
.dots i.on{width:22px;background:#fff}

footer.ft{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:56px var(--gutR) 0 var(--gut);color:var(--dim);font-size:12.5px}
footer.ft img{width:190px;max-width:62%}
footer.ft nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;color:#b2b2ba;font-size:13px}
footer.ft nav a{text-decoration:none}

.tabbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;padding:5px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tabbar button{position:relative;z-index:1;padding:13px 30px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:15px;color:#8f8f98;transition:color .3s}
.tabbar button.on{color:#000}
.tabbar .tp{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;background:#fff;transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1)}

/* app page */
#page{position:fixed;inset:0;z-index:70;background:#000;overflow:hidden;touch-action:pan-y}
#page.closing{animation:pOut .45s var(--ease) forwards}
@keyframes pOut{to{opacity:0;transform:translateY(70px) scale(.96)}}
#page.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.pw{position:absolute;inset:0;background-size:cover;background-position:center}
.pw.tintora{background-image:url(img/tintora-bg.webp)}
.pw.kanji{background-image:url(img/kanji-bg.webp)}
.pw.tunnel{background:#2a170a}
.pw .dig{position:absolute;left:0;right:0;top:0;height:200%;background:url(img/ground1.webp) repeat-y;background-size:100% 50%;animation:dig 6s linear infinite}
@keyframes dig{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.pshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.62) 35%,rgba(0,0,0,.94) 70%,#000)}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petals i{position:absolute;top:-20px;width:12px;height:9px;border-radius:12px 0 12px 0;background:#f6b7c9;opacity:.85;left:var(--x);animation:fall var(--t) linear var(--dl) infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.psc{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;z-index:3;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutR) calc(48px + env(safe-area-inset-bottom,0px)) var(--gut)}
.pin{max-width:560px;margin:0 auto}
.ptop{display:flex;align-items:center;justify-content:space-between;height:46px}
.back{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back svg{width:20px;height:20px}
.grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.ptop .sp{width:44px}
.picon{width:108px;height:108px;border-radius:22%;margin:22px auto 16px;box-shadow:0 24px 50px -18px rgba(0,0,0,.95)}
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.7);margin:0}
.phead h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,44px);line-height:1;letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
.phead .sub{margin:0;font-family:var(--display);font-weight:600;font-size:14px;color:#d6d6dc}
.phead .line{margin:8px 0 4px;color:#cacad2;max-width:32ch;font-size:16px}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:15px 28px;border-radius:999px;background:#fff;color:#000;text-decoration:none;font-family:var(--display);font-weight:700;font-size:15px;transition:transform .2s}
.cta:active{transform:scale(.96)}
.cta svg{width:18px;height:18px}
.cta.soon{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.blk{margin-top:46px}
.blk h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:0 0 16px;text-align:center}
.device{width:min(74vw,300px);aspect-ratio:9/16;margin:0 auto;border-radius:36px;border:7px solid #141418;outline:1px solid #2a2a31;overflow:hidden;background:#000;box-shadow:0 40px 80px -30px rgba(0,0,0,.95)}
.device video{width:100%;height:100%;object-fit:cover}
.facts{list-style:none;margin:0;padding:0}
.facts li{padding:14px 2px;border-top:1px solid rgba(255,255,255,.1);color:#e2e2e7;display:flex;gap:12px;align-items:baseline}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;flex:none;transform:translateY(-2px)}
.mobs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mobs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px}
.mobs img{width:100%;aspect-ratio:1;object-fit:contain;animation:idle 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.7s)}
@keyframes idle{50%{transform:translateY(-5px) scale(1.03)}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips span{padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-size:13px;background:rgba(255,255,255,.05)}
.legal{display:flex;justify-content:center;gap:18px;margin-top:40px;font-size:13px;color:#a9a9b1}
.pft{display:flex;justify-content:center;margin-top:36px;color:var(--dim);font-size:12.5px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--out),transform .8s var(--out);transition-delay:calc(var(--d,0)*70ms)}
.on-rv .rv{opacity:1;transform:none}

.trans{position:absolute;inset:0;z-index:6;pointer-events:none}
.bands{position:absolute;inset:0;display:flex;flex-direction:column-reverse}
.bands i{flex:1;margin-top:-2px;transform:translateY(110vh);border-radius:50% 50% 0 0/16px 16px 0 0}
.opening .bands i{animation:bIn .5s var(--out) forwards,bOut .55s var(--ease) forwards;animation-delay:calc(var(--i)*55ms),calc(.85s + var(--i)*35ms)}
@keyframes bIn{to{transform:none}}
@keyframes bOut{from{transform:none}to{transform:translateY(-120vh)}}
.drill{position:absolute;inset:0;overflow:hidden;opacity:0}
.opening .drill{animation:dLayer 1.25s forwards}
@keyframes dLayer{0%,70%{opacity:1}100%{opacity:0}}
.drill .dig{position:absolute;left:0;right:0;top:0;height:200%;background:url(img/ground1.webp) repeat-y;background-size:100% 50%;animation:dig .9s linear infinite}
.drill .rk{position:absolute;left:50%;top:110%;width:96px;transform:translateX(-50%)}
.opening .drill .rk{animation:rkUp .55s .1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes rkUp{to{top:-40%}}
.drill .ck{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:#7a4a22;border:2px solid #2b1608;border-radius:30%;opacity:0}
.opening .drill .ck{animation:burst .8s .38s var(--out) forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(220deg)}}
.bloom{position:absolute;inset:0;background:#0b1022 url(img/kanji-bg.webp) center/cover;clip-path:circle(0 at var(--cx,50%) var(--cy,50%))}
.bloom::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(246,183,201,.55),rgba(246,183,201,0) 45%)}
.opening .bloom{animation:bloomIn .8s var(--ease) forwards,fadeO .5s 1.1s forwards}
@keyframes bloomIn{to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes fadeO{to{opacity:0}}
.pb{position:absolute;left:var(--cx,50%);top:var(--cy,50%);width:var(--s);height:calc(var(--s)*.75);border-radius:12px 0 12px 0;background:var(--c);opacity:0}
.opening .pb{animation:petal 1.3s var(--out) forwards;animation-delay:calc(var(--i)*12ms)}
@keyframes petal{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1)}}
.fly{position:fixed;z-index:80;pointer-events:none;border-radius:22%;object-fit:cover;box-shadow:0 24px 50px -18px rgba(0,0,0,.9)}

@media (max-height:720px) and (max-width:899px){
  header.top{padding-top:10px;padding-bottom:6px}
  header.top img{height:28px}
  .head h1{font-size:36px}
  .head p{margin-top:4px;font-size:13px}
  .shelf{margin-top:10px}
}
@media (min-width:900px){
  :root{--ch:min(620px,calc(100svh - 290px));}
  .dots{display:none}
  header.top{padding-top:22px}
  header.top img{height:38px}
  .head{text-align:center}
  .track{justify-content:safe center;padding-inline:max(40px,calc((100vw - 3 * var(--cw) - 28px) / 2))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>
<div id="flash"></div>

<header class="top"><img src="img/mark.png" alt="Artyom Black"></header>

<main>
  <section class="head"><h1 id="title"><span>Games</span></h1><p id="count">2 games on Google Play</p></section>
  <section class="shelf" aria-label="Titles"><div class="track" id="track"></div><div class="dots" id="dots"></div></section>
  <footer class="ft">
    <img src="img/logo-horizontal.png" alt="Artyom Black">
    <nav>
      <a href="https://play.google.com/store/apps/developer?id=artyom+black" target="_blank" rel="noopener">Google Play</a>
    </nav>
    <span>© 2026 Artyom Black</span>
  </footer>
</main>

<nav class="tabbar" id="tabbar" aria-label="Category"><span class="tp"></span><button data-k="Game" class="on" id="tabGames">Games</button><button data-k="App" id="tabApps">Apps</button></nav>

<section id="page" hidden aria-modal="true" role="dialog"></section>

<div id="intro"><div class="ib"><img src="img/logo-vertical.png" alt=""><i class="sheen"></i></div></div>

<script>
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 2.8v18.4c0 .4.4.6.7.4l15.6-9.2c.3-.2.3-.6 0-.8L4.7 2.4c-.3-.2-.7 0-.7.4z"/></svg>';
const PAL=["#bf0606","#2b8a08","#cc0cc2","#f77205","#e8d610","#1696db","#ffffff"];
const APPS=[
  {id:"tintora",name:"Tintora Sort",kind:"Game",genre:"Puzzle",icon:"img/tintora-icon.webp",video:"media/tintora.mp4",poster:"media/tintora.jpg",
   line:"Pour the colors from bottle to bottle until every bottle holds just one.",
   url:"https://play.google.com/store/apps/details?id=com.artyomblack.tintorasort",
   privacy:"https://artyom-black.github.io/TintoraSort-InfoSite/",
   facts:["Tap a bottle, then tap where it should pour","Hidden colors show up as you clear the layers above them","Finished bottles get a cork","Undo, an extra bottle or a restart when you're stuck"]},
  {id:"tunnel",name:"Tunnel Ride",sub:"Survival Shooter",kind:"Game",genre:"Action",icon:"img/tunnel-icon.webp",video:"media/tunnel.mp4",poster:"media/tunnel.jpg",
   line:"Fly your drill up through the tunnels, dodge the rocks, shoot through walls and beat what lives down there.",
   url:"https://play.google.com/store/apps/details?id=com.artyomblackgames.tunnelride",
   privacy:"https://artyom-black.github.io/tunnel-ride-privacy-policy/",terms:"https://artyom-black.github.io/tunnel-ride-terms-of-service/",
   facts:["Swipe left or right to change lanes","Tap to shoot","Break the big walls before they reach you","Collect coins and upgrade your drill in the Garage"]},
  {id:"kanji",name:"I Love Kanji",kind:"App",genre:"Education",icon:"img/kanji-icon.webp",video:"media/kanji.mp4",poster:"media/kanji.jpg",url:"https://play.google.com/store/apps/details?id=com.artyomblack.ilovekanji",
   line:"Learn 2,200 kanji from N5 to N1 with stories, flashcards and quizzes.",
   privacy:"https://artyom-black.github.io/ILoveKanji-info/#privacy-policy",terms:"https://artyom-black.github.io/ILoveKanji-info/#terms-of-service",
   chips:["2,200 kanji","N5 to N1","Stories","Flashcards","Quizzes","Smart reviews","Pronunciation audio","Mistake practice"]}
];
const $=s=>document.querySelector(s);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- shelf ---------- */
const track=$("#track"),dots=$("#dots"),tabbar=$("#tabbar"),tp=tabbar.querySelector(".tp");
let list=[],active=0;
function render(kind,anim){
  list=APPS.filter(a=>a.kind===kind);
  const h=$("#title");h.innerHTML=`<span>${kind==="Game"?"Games":"Apps"}</span>`;h.classList.remove("swap");void h.offsetWidth;if(anim)h.classList.add("swap");
  $("#count").textContent=kind==="Game"?`${list.length} games on Google Play`:`${list.length} app on Google Play`;
  track.innerHTML=list.map((a,i)=>`<button class="card enter" data-id="${a.id}" style="--i:${i}" aria-label="Open ${a.name}">
    <img class="poster" src="${a.poster}" alt="">
    <video muted loop playsinline preload="${i===0?"auto":"metadata"}" poster="${a.poster}" src="${a.video}"></video>
    <span class="grad"></span>
    <span class="meta"><img class="ic" src="${a.icon}" alt=""><span class="tx"><b>${a.name}</b><small>${a.soon?a.genre+" · Coming soon":(a.sub||a.genre)}</small></span><span class="go">${ARROW}</span></span>
  </button>`).join("");
  dots.innerHTML=list.length>1?list.map(()=>"<i></i>").join(""):"";
  track.scrollLeft=0;active=-1;requestAnimationFrame(flow);
}
const wide=matchMedia("(min-width:900px)");
function flow(){
  const cards=[...track.children],mid=innerWidth/2;let best=0,bd=1e9;
  if(wide.matches){cards.forEach(c=>{c.style.transform="";c.style.opacity="";const v=c.querySelector("video");const p=v.play();p&&p.catch(()=>{});});active=-2;return;}
  cards.forEach((c,i)=>{const r=c.getBoundingClientRect(),d=(r.left+r.width/2-mid)/r.width,ad=Math.min(Math.abs(d),1.2);
    if(Math.abs(d)<bd){bd=Math.abs(d);best=i;}
    if(!reduce)c.style.transform=`rotateY(${Math.max(-1,Math.min(1,d))*-9}deg) scale(${1-ad*.09})`;
    c.style.opacity=String(1-Math.min(ad,1)*.4);});
  if(best!==active){active=best;cards.forEach((c,i)=>{const v=c.querySelector("video");if(i===active){const p=v.play();p&&p.catch(()=>{});}else v.pause();});
    dots.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on",i===active));}
}
let fq=0;track.addEventListener("scroll",()=>{if(!fq)fq=requestAnimationFrame(()=>{fq=0;flow();});},{passive:true});
addEventListener("resize",()=>{flow();placePill(tabbar.querySelector(".on"));});
track.addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;
  const i=[...track.children].indexOf(c);
  const r=c.getBoundingClientRect(),fully=r.left>=0&&r.right<=innerWidth;
  if(i!==active&&!fully){c.scrollIntoView({behavior:reduce?"auto":"smooth",inline:"center",block:"nearest"});return;}
  openApp(c.dataset.id,c);});
function placePill(b){if(!b)return;tp.style.width=b.offsetWidth+"px";tp.style.transform=`translateX(${b.offsetLeft-5}px)`;}
tabbar.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.classList.contains("on"))return;
  tabbar.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));placePill(b);render(b.dataset.k,true);bolt();
  scrollTo({top:0,behavior:reduce?"auto":"smooth"});});
document.addEventListener("visibilitychange",()=>{const v=track.children[active]?.querySelector("video");if(!v)return;if(document.hidden)v.pause();else if($("#page").hidden)v.play().catch(()=>{});});

/* ---------- sparks + lightning ---------- */
const cv=$("#sparks"),cx=cv.getContext("2d"),fl=$("#flash");
let W=0,H=0,P=[],bolts=[],ptr={x:-999,y:-999},last=0,next=6000,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.min(150,Math.round(W*H/8000));while(P.length<n)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});P.length=n;}
size();addEventListener("resize",size);
const setPtr=e=>{ptr.x=e.clientX;ptr.y=e.clientY;};
addEventListener("pointermove",setPtr,{passive:true});addEventListener("pointerdown",setPtr,{passive:true});
addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")setTimeout(()=>{ptr.x=ptr.y=-999;},600);},{passive:true});
function bolt(){if(reduce)return;const pts=[];let x=W*(.2+Math.random()*.6),y=0;pts.push([x,y]);while(y<H){y+=16+Math.random()*28;x+=(Math.random()-.5)*55;pts.push([x,y]);}
  const s=pts[Math.floor(pts.length*.35)],br=[[s[0],s[1]]];let bx=s[0],by=s[1];for(let i=0;i<6;i++){by+=18+Math.random()*24;bx+=(Math.random()>.5?1:-1)*(8+Math.random()*28);br.push([bx,by]);}
  bolts.push({pts,br,life:1});fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");}
function line(pts,w,a){cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.lineWidth=w;cx.strokeStyle=`rgba(255,255,255,${a})`;cx.stroke();}
function loop(now){
  if($("#page").hidden&&!document.hidden){
    cx.clearRect(0,0,W,H);
    for(const p of P){const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy)||1;if(d<110){p.vx+=dx/d*.06;p.vy+=dy/d*.06;}
      p.vx*=.985;p.vy*=.985;p.vx+=(Math.random()-.5)*.02;p.vy+=(Math.random()-.5)*.02;p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;}
    for(let i=0;i<P.length;i++){const a=P[i],dm=Math.hypot(a.x-ptr.x,a.y-ptr.y);cx.fillStyle=`rgba(255,255,255,${dm<140?.95:.38})`;cx.fillRect(a.x,a.y,1.5,1.5);
      for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x;if(dx>70||dx<-70)continue;const d=Math.hypot(dx,a.y-b.y);if(d<70){const near=Math.min(dm,Math.hypot(b.x-ptr.x,b.y-ptr.y))<150;
        cx.strokeStyle=`rgba(255,255,255,${(1-d/70)*(near?.45:.07)})`;cx.lineWidth=.6;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}}
    if(!reduce&&now-last>next){bolt();last=now;next=9000+Math.random()*7000;}
    cx.save();cx.shadowColor="rgba(255,255,255,.9)";cx.shadowBlur=16;bolts=bolts.filter(b=>{line(b.pts,2,b.life);line(b.br,1.1,b.life*.8);b.life-=.035;return b.life>0;});cx.restore();
  }
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- app page ---------- */
const page=$("#page");let cur=null,srcCard=null,busy=false,pushed=false;
function petals(n){let h="";for(let i=0;i<n;i++)h+=`<i style="--x:${Math.random()*100}%;--t:${7+Math.random()*7}s;--dl:${-Math.random()*12}s;--dx:${Math.random()*120-60}px;scale:${.6+Math.random()*.7}"></i>`;return `<div class="petals">${h}</div>`;}
function world(a){if(a.id==="tunnel")return `<div class="pw tunnel"><div class="dig"></div></div>`;return `<div class="pw ${a.id}">${a.id==="kanji"?petals(18):""}</div>`;}
function trans(a){
  if(a.id==="tintora")return `<div class="trans"><div class="bands">${[5,2,4,1,3,0,5].map((c,i)=>`<i style="--i:${i};background:${PAL[c]}"></i>`).join("")}</div></div>`;
  if(a.id==="tunnel"){let ch="";for(let i=0;i<14;i++){const an=Math.random()*6.28,r=120+Math.random()*180;ch+=`<i class="ck" style="--s:${8+Math.random()*16}px;--dx:${Math.cos(an)*r}px;--dy:${Math.sin(an)*r}px"></i>`;}
    return `<div class="trans"><div class="drill"><div class="dig"></div><img class="rk" src="img/rocket.webp" alt="">${ch}</div></div>`;}
  let pt="";const cols=["#f6b7c9","#f9cdd9","#ee9fb6","#fde3ea"];
  for(let i=0;i<34;i++){const an=Math.random()*6.28,r=140+Math.random()*300;pt+=`<i class="pb" style="--i:${i};--s:${10+Math.random()*12}px;--c:${cols[i%4]};--dx:${Math.cos(an)*r}px;--dy:${Math.sin(an)*r+60}px;--r:${(Math.random()*720-360)|0}deg"></i>`;}
  return `<div class="trans"><div class="bloom"></div>${pt}</div>`;
}
function extra(a){
  if(a.id==="tunnel")return `<div class="blk rv" style="--d:7"><h3>How it plays</h3><ul class="facts">${a.facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>
    <div class="blk rv" style="--d:8"><h3>Down there</h3><div class="mobs"><figure style="--i:0"><img src="img/pebble_imp.webp" alt="">Nib</figure><figure style="--i:1"><img src="img/tunnel_biter.webp" alt="">Bite</figure><figure style="--i:2"><img src="img/boss_rock_guardian.webp" alt="">Rust</figure></div></div>`;
  if(a.facts)return `<div class="blk rv" style="--d:7"><h3>How it plays</h3><ul class="facts">${a.facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>`;
  return `<div class="blk rv" style="--d:7"><h3>Inside</h3><div class="chips">${a.chips.map(c=>`<span>${c}</span>`).join("")}</div></div>`;
}
function openApp(id,card){
  if(busy)return;busy=true;const a=APPS.find(x=>x.id===id);cur=a;srcCard=card;
  const from=card.querySelector(".ic"),cv=card.querySelector("video");cv.pause();
  page.className="";page.hidden=false;document.body.style.overflow="hidden";
  page.innerHTML=`${world(a)}<div class="pshade"></div>${trans(a)}
   <div class="psc"><div class="pin">
    <div class="ptop"><button class="back" aria-label="Back">${BACK}</button><span class="grab"></span><span class="sp"></span></div>
    <img class="picon" src="${a.icon}" alt="">
    <div class="phead"><p class="lbl rv" style="--d:0">${a.kind} · ${a.genre}</p><h2 class="rv" style="--d:1">${a.name}</h2>${a.sub?`<p class="sub rv" style="--d:2">${a.sub}</p>`:""}
     <p class="line rv" style="--d:3">${a.line}</p>
     ${a.soon?`<span class="cta soon rv" style="--d:4">Coming soon to Google Play</span>`:`<a class="cta rv" style="--d:4" href="${a.url}" target="_blank" rel="noopener">${PLAY}Get it on Google Play</a>`}</div>
    <div class="blk rv" style="--d:5"><h3>${a.kind==="Game"?"Gameplay":"Inside the app"}</h3><div class="device"><video muted loop playsinline autoplay preload="auto" poster="${a.poster}" src="${a.video}"></video></div></div>
    ${extra(a)}
    <div class="legal rv" style="--d:9"><a href="${a.privacy}" target="_blank" rel="noopener">Privacy policy</a>${a.terms?`<a href="${a.terms}" target="_blank" rel="noopener">Terms of service</a>`:""}</div>
    <div class="pft">© 2026 Artyom Black</div>
   </div></div>`;
  const pv=page.querySelector(".device video");try{pv.currentTime=cv.currentTime||0;}catch(e){}pv.play().catch(()=>{});
  const s=from.getBoundingClientRect(),di=page.querySelector(".picon"),t=di.getBoundingClientRect();
  const tl=page.querySelector(".trans");if(tl){tl.style.setProperty("--cx",(s.left+s.width/2)+"px");tl.style.setProperty("--cy",(s.top+s.height/2)+"px");}
  di.style.visibility="hidden";from.style.visibility="hidden";
  const fly=document.createElement("img");fly.src=a.icon;fly.className="fly";document.body.appendChild(fly);
  const R=r=>({left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  Object.assign(fly.style,R(s));void page.offsetWidth;page.classList.add("opening");
  if(id==="tunnel"&&!reduce)setTimeout(()=>page.classList.add("shake"),380);
  const dur=reduce?1:id==="tintora"?1000:780;
  fly.animate([{...R(s),rotate:"0deg"},{...R(t),rotate:"0deg",offset:.6},{...R(t),rotate:"0deg"}],{duration:dur,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"}).onfinish=()=>{di.style.visibility="";fly.remove();busy=false;};
  setTimeout(()=>page.classList.add("on-rv"),reduce?0:id==="tintora"?950:700);
  page.querySelector(".back").onclick=()=>closeApp();
  swipeClose(page.querySelector(".psc"));
  try{history.pushState({app:id},"","#"+id);pushed=true;}catch(e){pushed=false;}
}
function closeApp(fromPop){
  if(busy||page.hidden)return;busy=true;
  if(pushed&&!fromPop){pushed=false;try{history.back();}catch(e){}}
  const di=page.querySelector(".picon"),t=di.getBoundingClientRect(),from=srcCard.querySelector(".ic"),s=from.getBoundingClientRect();
  const R=r=>({left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  const fly=document.createElement("img");fly.src=cur.icon;fly.className="fly";document.body.appendChild(fly);Object.assign(fly.style,R(t));di.style.visibility="hidden";
  page.style.transform="";page.classList.add("closing");
  fly.animate([R(t),R(s)],{duration:reduce?1:520,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"}).onfinish=()=>{
    from.style.visibility="";fly.remove();page.hidden=true;page.className="";page.innerHTML="";document.body.style.overflow="";busy=false;
    const v=srcCard.querySelector("video");v.play().catch(()=>{});};
}
addEventListener("popstate",()=>{if(!page.hidden){pushed=false;closeApp(true);}});
addEventListener("keydown",e=>{if(e.key==="Escape")closeApp();});
function swipeClose(sc){let y0=null,dy=0;
  sc.addEventListener("touchstart",e=>{if(sc.scrollTop<=0){y0=e.touches[0].clientY;dy=0;}},{passive:true});
  sc.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){page.style.transform=`translateY(${dy*.5}px) scale(${1-Math.min(dy,300)/3000})`;page.style.borderRadius="28px";}},{passive:true});
  sc.addEventListener("touchend",()=>{if(y0==null)return;y0=null;if(dy>110)closeApp();else{page.style.transition="transform .3s";page.style.transform="";setTimeout(()=>page.style.transition="",300);}});}


/* ---------- intro ---------- */
function intro(){const el=$("#intro");if(reduce){el.classList.add("done");return;}el.classList.add("run");setTimeout(bolt,1750);setTimeout(()=>el.classList.add("done"),2500);}
render("Game",false);requestAnimationFrame(()=>placePill(tabbar.querySelector(".on")));intro();
if(location.hash.length>1){const id=location.hash.slice(1),a=APPS.find(x=>x.id===id);if(a){if(a.kind!=="Game")$("#tabApps").click();setTimeout(()=>{const c=track.querySelector(`[data-id="${id}"]`);if(c)openApp(id,c);},2600);}}
</script>
</body>
